name: Bug report
description: A request fails, a response doesn't parse, or the client behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Using the Home Assistant integration? Problems with entities or setup belong in
        [ha-veeam-365](https://github.com/Cenvora/ha-veeam-365/issues). Report here when the
        library itself fails: a request error, a model that rejects a real response, or an
        authentication problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: "What you expected, and what happened instead."
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      placeholder: |
        from veeam_365.client import VeeamClient
        …
      render: python
    validations:
      required: false

  - type: input
    id: sdk-version
    attributes:
      label: veeam-365 version
      description: "`pip show veeam-365`"
    validations:
      required: true

  - type: dropdown
    id: api-version
    attributes:
      label: API version
      options:
        - "v8"
        - "v7"
        - "v6"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: product-version
    attributes:
      label: Veeam Backup for Microsoft 365 version
      description: "Full build number of the server you are talking to."
      placeholder: "8.x.x.xxx"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.7"
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error
      description: "The full traceback. Redact hostnames and tokens."
      render: text
    validations:
      required: false

  - type: textarea
    id: response
    attributes:
      label: Server response
      description: |
        If a model fails to parse, the raw JSON the server sent (redacted) makes this far
        quicker to fix.
      render: json
    validations:
      required: false
